<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — AC1DST4R</title>

    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="The page you're looking for doesn't exist.">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #0d1117;
            color: #ffffff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
            mask-image: radial-gradient(circle, black, transparent 75%);

            pointer-events: none;
        }

        .container {
            width: min(700px, 90%);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .error {
            font-size: clamp(100px, 22vw, 220px);
            line-height: 0.8;
            font-weight: 900;
            letter-spacing: -12px;

            color: #ffffff;

            text-shadow:
                4px 0 #ff0000,
                -4px 0 rgba(255,255,255,0.08);

            animation: glitch 3s infinite;
            user-select: none;
        }

        .error span {
            color: #ff0000;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #ff0000;

            margin: 35px auto 25px;

            box-shadow:
                0 0 15px rgba(255, 0, 0, 0.6);
        }

        h1 {
            margin: 0;

            font-size: clamp(22px, 5vw, 36px);
            font-weight: 700;
            letter-spacing: -1px;
        }

        p {
            margin: 15px auto 0;

            max-width: 500px;

            color: #8b949e;
            font-size: 16px;
            line-height: 1.6;
        }

        .path {
            display: inline-block;

            margin-top: 20px;
            padding: 8px 12px;

            border: 1px solid #30363d;
            border-radius: 8px;

            background: rgba(255,255,255,0.025);

            color: #8b949e;

            font-family: monospace;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;

            margin-top: 30px;

            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
        }

        .button {
            padding: 12px 20px;

            border-radius: 9px;

            font-size: 14px;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .primary {
            background: #ffffff;
            color: #0d1117;
        }

        .secondary {
            background: #161b22;
            border: 1px solid #30363d;
            color: #ffffff;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary:hover {
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        .secondary:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.15);
        }

        .footer {
            margin-top: 50px;

            color: #484f58;

            font-size: 12px;
            letter-spacing: 1px;
        }

        .footer b {
            color: #ff0000;
        }

        @keyframes glitch {
            0%,
            92%,
            100% {
                transform: translate(0);
            }

            93% {
                transform: translate(-4px, 2px);
            }

            94% {
                transform: translate(4px, -2px);
            }

            95% {
                transform: translate(-2px, 1px);
            }

            96% {
                transform: translate(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error {
                animation: none;
            }

            .button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="error">
            4<span>0</span>4
        </div>

        <div class="divider"></div>

        <h1>You've wandered into the void.</h1>

        <p>
            The page you're looking for doesn't exist,
            was moved, or was never here in the first place.
        </p>

        <div class="path" id="path"></div>

        <div class="buttons">
            <a class="button primary" href="/">
                ← Return Home
            </a>

            <a class="button secondary" href="javascript:history.back()">
                Go Back
            </a>
        </div>

        <div class="footer">
            AC1DST4R <b>///</b> NO SIGNAL
        </div>

    </main>

    <script>
        document.getElementById("path").textContent =
            window.location.pathname;
    </script>

</body>
</html>
